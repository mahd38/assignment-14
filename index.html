<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashe. - New Season Essentials</title>
  
  <!-- Google Fonts for typography -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* --- CSS Reset & Global Styles --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: #1900ff;
      background-color: #ff0000;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-transform: none;
      text-decoration: none;
      color: inherit;
    }

    /* --- Top Utility Bar --- */
    .top-bar {
      background-color: #00eeff;
      text-align: center;
      padding: 8px 10px;
      font-size: 12px;
      color: #00aeff;
      letter-spacing: 0.5px;
    }

    /* --- Main Header / Navigation --- */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      height: 80px;
      background-color: #fbff00;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: #555555;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a:hover {
      color: #e65540;
    }

    .nav-links i {
      font-size: 10px;
      color: #888888;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 16px;
      color: #333333;
    }

    .header-icons a {
      transition: color 0.3s ease;
    }

    .header-icons a:hover {
      color: #e65540;
    }

    /* --- Hero Banner Section --- */
    .hero-section {
      position: relative;
      width: 100%;
      height: calc(100vh - 118px); /* Adjusts dynamically to fill viewport below header */
      min-height: 500px;
      /* Background setup with dark overlay tint matching the prompt image */
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                  url('https://unsplash.com') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero-content {
      color: #ff00bf;
      max-width: 800px;
      animation: fadeIn 1s ease-out;
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .hero-title {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 25px;
      letter-spacing: -1px;
    }

    .hero-description {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 35px;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    .hero-btn {
      display: inline-block;
      background-color: #4e1b7e;
      color: #222222;
      padding: 16px 45px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .hero-btn:hover {
      background-color: #e65540;
      color: #000000;
      box-shadow: 0 6px 20px rgba(230, 85, 64, 0.3);
    }

    /* Simple Fade-in Entry Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Responsive Breakpoints --- */
    @media (max-width: 992px) {
      .main-header {
        padding: 20px 30px;
      }
      .hero-title {
        font-size: 54px;
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none; /* Hide standard nav items on mobile devices */
      }
      .main-header {
        padding: 20px 20px;
      }
      .hero-title {
        font-size: 42px;
      }
      .hero-description {
        font-size: 14px;
      }
      .hero-btn {
        padding: 14px 35px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Notification Bar -->
  <div class="top-bar">
    30 day returns, no questions asked
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <!-- Brand Logo -->
    <div class="logo">Fashe.</div>

    <!-- Navigation Menu Items -->
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop <i class="fa-solid fa-chevron-down"></i></a></li>
        <li><a href="#">Product</a></li>
        <li><a href="#">Blog <i class="fa-solid fa-chevron-down"></i></a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <!-- Utility Icons (Search, User, Cart) -->
    <div class="header-icons">
      <a href="#" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="#" aria-label="Profile"><i class="fa-regular fa-user"></i></a>
      <a href="#" aria-label="Shopping Cart"><i class="fa-solid fa-basket-shopping"></i></a>
    </div>
  </header>

  <!-- Hero Content / Banner Section -->
  <section class="hero-section">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxOHBKj333TB3IXz6d2c4vfMXfTF9mrtC5B_sqDu2lZA&s=10" alt="">
    <div class="hero-content">
      <p class="hero-subtitle">New Season</p>
      <h1 class="hero-title">New season<br>essentials</h1>
      <p class="hero-description">Considered pieces, made to be worn every day.</p>
      <a href="#" class="hero-btn">Shop Now</a>
    </div>
  </section>
<input type="file">
</body>
</html>
